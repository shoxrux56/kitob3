<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Привет! Rus tili arkada</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Onest:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2FF;--sf:#fff;--ink:#16204A;--mu:#4F5A8C;--ln:#D2DAF6;--bl:#2F5BEA;--bld:#1B3DB0;--te:#0B8174;--ted:#075E55;--go:#FFB320;--god:#9A6200;--co:#D42F50;--cod:#9E1F38;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1433;--sf:#19214D;--ink:#EEF1FF;--mu:#A9B2DE;--ln:#2D3869;--bl:#3F69F5;--bld:#2A4BC4;--god:#FFC74D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1433;--sf:#19214D;--ink:#EEF1FF;--mu:#A9B2DE;--ln:#2D3869;--bl:#3F69F5;--bld:#2A4BC4;--god:#FFC74D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Onest,system-ui,sans-serif;overscroll-behavior:none}
h1,h2,.big,.tg b{font-family:Unbounded,Onest,system-ui,sans-serif;margin:0;line-height:1.15}
#app{max-width:640px;margin:0 auto;padding:14px 14px 30px}
p{margin:6px 0}.mu{color:var(--mu)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chip{background:var(--sf);border:2px solid var(--ln);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.hero{background:var(--bl);color:#fff;border-radius:28px;padding:26px 22px;margin-bottom:16px;border-bottom:7px solid var(--bld)}
.hero h1{font-size:clamp(36px,11vw,56px)}
.modes,.opts{display:grid;gap:12px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--sf);color:var(--ink);border:2px solid var(--ln);border-bottom:6px solid var(--ln);border-radius:20px;padding:14px 16px;font:inherit;cursor:pointer}
.mode b{display:block;font-size:17px}
.mode .ic{font-size:30px;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;flex:none}
.mode:active,.btn:active{transform:translateY(3px)}
.btn{font:700 16px Onest,system-ui,sans-serif;border:0;border-bottom:5px solid var(--bld);background:var(--bl);color:#fff;border-radius:16px;padding:13px 20px;cursor:pointer}
.btn.g{background:var(--te);border-color:var(--ted)}
.btn.o{background:var(--sf);color:var(--ink);border:2px solid var(--ln);border-bottom:5px solid var(--ln)}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.tg{background:var(--sf);border:2px solid var(--ln);border-bottom:6px solid var(--ln);border-radius:18px;text-align:center;padding:8px 12px;margin-bottom:10px}
.tg small{display:block;color:var(--mu)}
.tg b{font-size:clamp(20px,6vw,28px);color:var(--bl)}
.cw{position:relative;width:fit-content;max-width:100%;margin:0 auto}
canvas{display:block;height:min(calc(100dvh - 250px),580px);min-height:300px;aspect-ratio:2/3;max-width:100%;border-radius:24px;touch-action:none;user-select:none;-webkit-user-select:none;border-bottom:7px solid #1a1f5c}
.ov{position:absolute;inset:0;border-radius:24px;background:rgba(14,20,51,.82);display:grid;place-content:center;gap:8px;text-align:center;color:#fff;padding:20px}
.ov[hidden]{display:none}
.ov .opts{margin-top:8px}
.ov .btn.o{background:#fff;color:#16204A;border-color:#cfd6f5}
.cf{position:fixed;top:-40px;font-style:normal;pointer-events:none;z-index:9;animation:cf 2s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
.hr{display:flex;gap:16px;margin-top:12px;font-size:40px}
.an-wave{animation:wave 1.6s ease-in-out infinite;transform-origin:70% 80%}
.an-bounce{animation:bnc 1.1s ease-in-out infinite}
.an-pulse{animation:pls 1.3s ease-in-out infinite}
.an-spin{animation:spn 2.6s ease-in-out infinite}
.an-shake{animation:shk 1.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(18deg)}20%,40%{transform:rotate(-14deg)}}
@keyframes bnc{50%{transform:translateY(-8px) scale(1.08)}}
@keyframes pls{50%{transform:scale(1.18)}}
@keyframes spn{0%,70%,100%{transform:rotate(0)}85%{transform:rotate(360deg)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{50%{transform:scale(1.08)}}
.rise{animation:rise .45s both}
.fc{perspective:900px;margin:10px 0 14px}
.fci{position:relative;height:340px;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}
.fci.fl{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;border:2px solid var(--ln);border-bottom:8px solid var(--ln);background:var(--sf);display:grid;place-content:center;gap:8px;text-align:center;padding:20px}
.fcb{transform:rotateY(180deg);background:var(--bl);color:#fff;border-color:var(--bld)}
.em{font-size:110px;line-height:1.1}
.qh .em{font-size:90px}
.em2{font-size:46px!important;padding:10px!important}
.prog{height:10px;border-radius:99px;background:var(--ln);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--te);border-radius:99px;transition:width .3s}
.btn.good{background:var(--te);border-color:var(--ted);color:#fff;animation:pop .4s}
.btn.bad{background:var(--co);border-color:var(--cod);color:#fff;animation:shk .4s}
.btn:disabled{opacity:.4}
@media (prefers-reduced-motion:reduce){[class*="an-"],.rise,.btn.good,.btn.bad{animation:none!important}.fci,.prog i{transition:none}}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;font-weight:700;z-index:20}
</style>
</head>
<body>
<div id="app">
<div id="mn"></div>
<div id="stage" hidden>
<div class="top"><button class="btn o" onclick="home()" aria-label="Menyuga qaytish">←</button><span class="chip" id="hl"></span><span class="chip" id="hs"></span></div>
<div class="tg"><small>Topilsin:</small><b id="tgt">·</b></div>
<div class="cw"><canvas id="cv"></canvas><div class="ov" id="ov" hidden></div></div>
</div>
</div>
<script>
const W=[["Здравствуйте","zdrást-vuyte","Assalomu alaykum"],["Привет","privét","Salom"],["Как дела?","kak dilá","Ishlar qanday?"],["Хорошо","xarashó","Yaxshi"],["Отлично","atlíchna","A'lo"],["Спасибо","spasíba","Rahmat"],["Пожалуйста","pazháluysta","Marhamat"],["До свидания","da svidániya","Xayr"],["Я","ya","Men"],["Ты","ti","Sen"],["Вы","vi","Siz"],["Он","on","U (erkak)"],["Она","aná","U (ayol)"],["Оно","anó","U (neytral)"],["Это","éta","Bu"],["Мой","moy","Mening (erkak)"],["Моя","maYá","Mening (ayol)"],["Моё","maYó","Mening (neytral)"]];
let st={xp:0,best:{},lv:{},days:0,last:""},G=null,raf,last;
try{Object.assign(st,JSON.parse(localStorage.getItem("rus2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("rus2",JSON.stringify(st))}catch(e){}};
{const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();if(st.last!=t){st.days=st.last==y?st.days+1:1;st.last=t;save()}}
const $=id=>document.getElementById(id),R=a=>a[Math.random()*a.length|0];
const LW=360,LH=540,cv=$("cv"),cx=cv.getContext("2d");
(()=>{const r=Math.min(devicePixelRatio||1,2);cv.width=LW*r;cv.height=LH*r;cx.setTransform(r,0,0,r,0,0)})();
let ac;const beep=(f,d=.1)=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
let VR=null,warned=false;
const pickV=()=>{try{VR=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang))||null}catch(e){}};
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}
const say=t=>{try{if(!("speechSynthesis" in window))throw 0;pickV();const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.rate=.85;if(VR)u.voice=VR;speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),60);if(!VR&&!warned&&speechSynthesis.getVoices().length){warned=true;toast("Qurilmada rus ovozi topilmadi. Telefon sozlamalari → Til → Matndan nutqqa bo'limidan rus tilini yuklab ol.")}}catch(e){if(!warned){warned=true;toast("Bu brauzer ovozni qo'llamaydi. Chrome yoki Safari'da och.")}}};
const stars=Array.from({length:34},()=>[Math.random()*LW,Math.random()*LH,Math.random()*1.6+.6]);
const col=w=>`hsl(${W.indexOf(w)*47%360} 65% 40%)`;
function pill(x,y,w,h,c){cx.beginPath();cx.roundRect(x-w/2,y-h/2,w,h,h/2);cx.fillStyle=c;cx.fill();cx.lineWidth=2;cx.strokeStyle="rgba(255,255,255,.6)";cx.stroke()}
function tx(s,x,y,sz=16,c="#fff"){cx.font=`700 ${sz}px Onest,system-ui,sans-serif`;cx.fillStyle=c;cx.textAlign="center";cx.textBaseline="middle";cx.fillText(s,x,y)}
const wid=(s,sz=16)=>{cx.font=`700 ${sz}px Onest,system-ui,sans-serif`;return cx.measureText(s).width};
function ask(g){let n;do{n=R(W)}while(n===g.q);g.q=n;$("tgt").textContent=P[W.indexOf(n)]+" "+n[2]}
function burst(g,x,y,c="#FFB320"){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=60+Math.random()*140;g.pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:.6,c})}}
function lose(g){g.lives--;g.shake=.3;beep(160,.25);if(g.lives<1)end()}
function hit(g,x,y,w){g.score++;burst(g,x,y);beep(720);setTimeout(()=>beep(920,.08),70);say(w[0])}
const games={
m:{name:"Meteorlar",ic:"☄️",col:"--bl",tag:"So'zlar yerga tushmasidan to'g'risini bos",lives:3,
how:"Tepadagi ma'noga mos ruscha so'zni meteor yerga tushmasidan bos. Xato bossang yoki to'g'ri so'z yerga tushsa, jon ketadi.",
init(g){g.items=[];g.nx=0;ask(g)},
update(g,dt){const v=70+Math.min(g.score*5,130);g.nx-=dt;const has=g.items.some(i=>i.w===g.q);
if((g.nx<=0||!has)&&g.items.length<9){g.nx=1.1-Math.min(g.score*.01,.4);const w=(!has||Math.random()<.4)?g.q:R(W.filter(x=>x!==g.q)),wd=wid(w[0])+26;g.items.push({w,wd,x:wd/2+6+Math.random()*(LW-wd-12),y:-20,bad:0})}
g.items=g.items.filter(i=>{i.y+=v*dt;i.bad-=dt;if(i.y>LH-40){if(i.w===g.q)lose(g);return false}return true})},
tap(g,x,y){const c=g.items.filter(i=>Math.abs(x-i.x)<i.wd/2+8&&Math.abs(y-i.y)<26).sort((a,b)=>b.y-a.y)[0];if(!c)return;
if(c.w===g.q){hit(g,c.x,c.y,c.w);g.items=g.items.filter(i=>i!==c);ask(g)}else{c.bad=.4;lose(g)}},
draw(g){g.items.forEach(i=>{pill(i.x,i.y,i.wd,34,i.bad>0?"#D42F50":col(i.w));tx(i.w[0],i.x,i.y+1)});cx.fillStyle="rgba(255,255,255,.15)";cx.fillRect(0,LH-30,LW,30);tx("🌍 Yer",LW/2,LH-15,13)}},
f:{name:"Parvoz",ic:"🐦",col:"--co",tag:"Bos va uch: to'g'ri so'zli darvozadan o't",lives:3,
how:"Ekranni bosib qush bilan uch. Tepadagi ma'noga mos ruscha so'zli darvozadan o't. Devorga urilsang yoki noto'g'ri darvozadan o'tsang bitta jon ketadi, qush esa yana teshikka qaytadi. 3 jon bor.",
init(g){g.y=270;g.vy=0;g.gs=[];gate(g,LW+60);g.hint=1},
update(g,dt){const sp=100+Math.min(g.score*2,40);g.inv=Math.max(0,(g.inv||0)-dt);g.vy+=800*dt;g.y+=g.vy*dt;
g.gs.forEach(o=>o.x-=sp*dt);g.gs=g.gs.filter(o=>o.x>-90);if(g.gs[g.gs.length-1].x<LW-220)gate(g,LW+20);
const n=g.gs.find(o=>!o.p);if(n&&n.q!==g.q){g.q=n.q;$("tgt").textContent=P[W.indexOf(n.q)]+" "+n.q[2]}
if(g.y<14){g.y=14;g.vy=0}if(g.y>LH-14){g.y=LH-14;g.vy=-300}
g.gs.forEach(o=>{if(90+13>o.x&&90-13<o.x+44){const ok=(g.y>53&&g.y<237)||(g.y>303&&g.y<487);if(!ok&&!g.inv){lose(g);g.inv=1.3;g.vy=0;g.y=o.t?145:395}}
if(!o.p&&90>o.x+22){o.p=true;if((g.y<270)===o.t)hit(g,90,g.y,o.q);else lose(g)}})},
tap(g){g.vy=-300;g.hint=0;beep(440,.04)},
draw(g){g.gs.forEach(o=>{[[0,40],[250,290],[500,540]].forEach(([a,b])=>{cx.fillStyle="#7A5CFF";cx.fillRect(o.x,a,44,b-a);cx.fillStyle="rgba(255,255,255,.25)";cx.fillRect(o.x,a,8,b-a)});
[[145,o.a],[395,o.b]].forEach(([y,w])=>{pill(o.x+22,y,wid(w[0],14)+18,30,col(w));tx(w[0],o.x+22,y+1,14)})});
cx.font="34px serif";cx.textAlign="center";cx.textBaseline="middle";cx.globalAlpha=g.inv>0?.5:1;cx.fillText("🐦",90,g.y);cx.globalAlpha=1;if(g.hint)tx("Bos va uch!",LW/2,LH-40,18)}},
z:{name:"Zarba",ic:"🐹",col:"--te",tag:"Teshikdan chiqqan to'g'ri so'zni tez ur",lives:3,
how:"Teshiklardan sichqonlar so'z bilan chiqadi. Faqat tepadagi ma'noga mos so'zni urib ol. 45 soniya vaqting bor.",
init(g){g.cs=Array.from({length:9},(_,i)=>({x:63+117*(i%3),y:200+125*(i/3|0),w:null,t:0,m:1}));g.nx=.3;g.time=45;ask(g)},
update(g,dt){g.time-=dt;if(g.time<=0)return end();g.nx-=dt;
if(g.nx<=0){g.nx=.55-Math.min(g.score*.01,.2);const e=g.cs.filter(c=>!c.w);if(e.length){const c=R(e),has=g.cs.some(k=>k.w===g.q);c.w=(!has||Math.random()<.35)?g.q:R(W.filter(x=>x!==g.q));c.m=c.t=1.8-Math.min(g.score*.02,.7)}}
g.cs.forEach(c=>{if(c.w){c.t-=dt;if(c.t<=0){if(c.w===g.q)lose(g);c.w=null}}})},
tap(g,x,y){const c=g.cs.find(c=>c.w&&Math.abs(x-c.x)<58&&Math.abs(y-c.y)<64);if(!c)return;
if(c.w===g.q){hit(g,c.x,c.y,c.w);c.w=null;ask(g)}else{c.w=null;lose(g)}},
draw(g){g.cs.forEach(c=>{cx.fillStyle="#12173F";cx.beginPath();cx.ellipse(c.x,c.y+34,48,16,0,0,6.28);cx.fill();
if(c.w){const s=Math.max(.05,Math.min(1,(c.m-c.t)/.15,c.t/.15));cx.save();cx.translate(c.x,c.y+30);cx.scale(s,s);cx.font="44px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText("🐹",0,-30);pill(0,6,wid(c.w[0],14)+16,28,col(c.w));tx(c.w[0],0,7,14);cx.restore()}})}}
};
function gate(g,x){const q=R(W),o=R(W.filter(z=>z!==q)),t=Math.random()<.5;g.gs.push({x,q,t,a:t?q:o,b:t?o:q,p:false})}
function ov(h){$("ov").innerHTML=h;$("ov").hidden=false}
function hud(){const s=(G.k=="z"?`⏱ ${Math.max(0,Math.ceil(G.time))} · `:"")+`⭐ ${G.score}`,l="❤️".repeat(Math.max(0,G.lives))+"🖤".repeat(G.max-Math.max(0,G.lives));if($("hs").textContent!=s)$("hs").textContent=s;if($("hl").textContent!=l)$("hl").textContent=l}
function render(){cx.save();cx.clearRect(0,0,LW,LH);const b=cx.createLinearGradient(0,0,0,LH);b.addColorStop(0,"#23338A");b.addColorStop(1,"#5B2C9E");cx.fillStyle=b;cx.fillRect(0,0,LW,LH);
cx.fillStyle="rgba(255,255,255,.5)";stars.forEach(s=>cx.fillRect(s[0],s[1],s[2],s[2]));
if(G.shake>0)cx.translate((Math.random()-.5)*G.shake*30,(Math.random()-.5)*G.shake*30);
G.d.draw(G);G.pt.forEach(p=>{cx.globalAlpha=Math.max(0,p.l*1.6);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,5,5)});cx.restore()}
function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;
if(!G.over)G.d.update(G,dt);else G.oa+=dt;
G.pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt});G.pt=G.pt.filter(p=>p.l>0);G.shake=Math.max(0,G.shake-dt);
render();hud();if(!G.over||G.oa<.8)raf=requestAnimationFrame(loop)}
function play(k){cancelAnimationFrame(raf);const d=games[k];G={k,d,score:0,lives:d.lives,max:d.lives,pt:[],shake:0,over:false,oa:0,go:false};
$("mn").hidden=true;$("stage").hidden=false;$("tgt").textContent="·";d.init(G);render();hud();
ov(`<div style="font-size:56px">${d.ic}</div><h2 style="font-size:22px">${d.name}</h2><p>${d.how}</p><button class="btn g" onclick="go()">Boshlash</button>`)}
function go(){$("ov").hidden=true;G.go=true;last=performance.now();raf=requestAnimationFrame(loop)}
function end(){if(G.over)return;G.over=true;beep(150,.4);const g=G,x=g.score*3,nb=g.score>(st.best[g.k]||0);st.xp+=x;if(nb)st.best[g.k]=g.score;save();
setTimeout(()=>{if(G!==g)return;ov(`<div style="font-size:56px">${nb?"🏆":"💥"}</div><h2 style="font-size:22px">${nb?"Yangi rekord!":"O'yin tugadi"}</h2><p class="big" style="font-size:42px">${g.score}</p><p>Rekord: ${st.best[g.k]||0} · +${x} XP</p><div class="opts"><button class="btn g" onclick="play('${g.k}')">Qayta o'ynash</button><button class="btn o" onclick="learn()">📖 O'rganish</button><button class="btn o" onclick="home()">Menyu</button></div>`);if(nb)conf()},650)}
cv.addEventListener("pointerdown",e=>{e.preventDefault();if(!G||G.over||!G.go)return;const r=cv.getBoundingClientRect();G.d.tap(G,(e.clientX-r.left)/r.width*LW,(e.clientY-r.top)/r.height*LH)});
document.addEventListener("keydown",e=>{if(e.code=="Space"&&G&&G.go&&!G.over){e.preventDefault();G.d.tap(G,0,0)}});
function conf(){for(let i=0;i<36;i++){const e=document.createElement("i");e.textContent=["🎉","⭐","✨","🪙","🔥"][i%5];e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.7}s;font-size:${18+Math.random()*18}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}}
function thm(){const d=document.documentElement;d.dataset.theme=(d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))=="dark"?"light":"dark"}


const P=["👋","🤗","😊","👍","🤩","🙏","🎁","🚶","🙋","🫵","👥","👨","👩","🧸","👉","🏠","📚","🍎"];
const AN=["wave","bounce","pulse","bounce","spin","pulse","bounce","wave","bounce","pulse","shake","bounce","pulse","shake","bounce","pulse","bounce","spin"];
const pic=i=>`<span class="an-${AN[i]}" style="display:inline-block">${P[i]}</span>`;
const HT=["«в» o'qilmaydi: «zdrastuyte». Asli «sog' bo'ling» degani.","Faqat do'st va tengdoshlarga ayt.","Как = qanday, дела = ishlar. Aynan «Ishlar qanday?».","Urg'usiz O → A bo'ladi: «xarashó», «xorosho» emas.","«Otlichnik» (a'lochi o'quvchi) so'zini eslang!","Asli «Спаси Бог», ya'ni «Xudo asrasin».","Uzun, lekin tez ayt: «pajalusta».","До = gacha, свидание = uchrashuv: «ko'rishguncha».","Bitta harf, osonroq bo'lmaydi!","Yaqin do'st yoki tengdoshga «sen».","Hurmat bilan «Siz». Ko'plikda «Sizlar» ham shu.","Erkak kishi yoki erkak jinsli narsa.","Ayol kishi yoki ayol jinsli narsa.","Neytral narsa (jinsi yo'q).","Это книга = Bu kitob. «Bo'ladi» so'zi kerak emas.","Мой друг = Mening do'stim (erkak jinsli so'z bilan).","Моя книга = Mening kitobim (ayol jinsli so'z bilan).","Моё имя = Mening ismim (neytral so'z bilan)."];
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function bare(){cancelAnimationFrame(raf);G=null;$("stage").hidden=true;$("mn").hidden=false}
const LV=[["Salomlashish va muloyimlik",0,8],["Olmoshlar",8,14],["Bu va mening",14,18]];
let L=null;
const tb=t=>`<div class="top"><button class="btn o" onclick="${t?"learn()":"home()"}" aria-label="Orqaga">←</button><span class="chip">${t||"📖 O'rganish"}</span><span class="chip">⭐ ${st.xp} XP</span></div>`;
const pg=v=>`<div class="prog"><i style="width:${Math.round(v*100)}%"></i></div>`;
function learn(){bare();$("mn").innerHTML=tb()+`<p class="mu">Har bosqichda avval 4 ta so'zni kartada ko'rasan, keyin shu so'zlarni sinaysan.</p><div class="modes">${LV.map((l,k)=>`<button class="mode rise" style="animation-delay:${k*70}ms" onclick="lvStart(${k})"><span class="ic" style="background:var(--bl);font-size:34px">${pic(l[1])}</span><span><b>${k+1}. ${l[0]}</b>${l[2]-l[1]} ta so'z<br><span class="mu">${"⭐".repeat(st.lv[k]||0)||"Hali o'tilmagan"}</span></span></button>`).join("")}</div>`;scrollTo(0,0)}
function lvStart(k){bare();const ids=[];for(let i=LV[k][1];i<LV[k][2];i++)ids.push(i);const g=[];for(let i=0;i<ids.length;i+=4)g.push(ids.slice(i,i+4));
L={k,g,gi:0,ti:0,q:[],qd:0,ok:0,miss:0,lock:false};teach()}
function teach(){const gr=L.g[L.gi],i=gr[L.ti],w=W[i],last=L.ti+1>=gr.length;
$("mn").innerHTML=tb("🧠 "+(L.k+1)+"-bosqich")+pg((L.gi+L.ti/(gr.length*2))/L.g.length)+`<p class="mu" style="text-align:center">Yangi so'z ${L.ti+1}/${gr.length}</p><div class="tg" style="padding:22px 14px;border-radius:28px;border-bottom-width:8px"><div class="em">${pic(i)}</div><h2 style="font-size:clamp(32px,11vw,50px);color:var(--bl);margin-top:6px">${w[0]}</h2><p class="mu" style="font-size:20px;margin:6px 0">[${w[1]}]</p><p style="font-size:20px"><b style="font-family:Onest,system-ui,sans-serif;color:var(--ink)">${w[2]}</b></p><p class="mu">${HT[i]}</p><button class="btn" style="margin-top:8px" onclick="say(W[${i}][0])">🔊 Eshitish</button></div><button class="btn g" id="nx" style="width:100%;margin-top:12px" onclick="tnext()">${last?"Sinab ko'ramiz →":"Keyingi so'z →"}</button>`;scrollTo(0,0);setTimeout(()=>say(w[0]),250)}
function tnext(){const gr=L.g[L.gi];L.ti++;if(L.ti>=gr.length){L.q=shuf(gr);L.qd=0;qz()}else teach()}
function qz(){const gr=L.g[L.gi];if(!L.q.length){L.gi++;L.ti=0;return L.gi>=L.g.length?lvEnd():teach()}
const i=L.q[0],w=W[i],A=Math.random()<.5;L.cur=i;L.lock=false;
const o=shuf([i,...shuf([...W.keys()].filter(k=>k!=i)).slice(0,3)]);
$("mn").innerHTML=tb("🧠 "+(L.k+1)+"-bosqich")+pg((L.gi+.5+.5*L.qd/gr.length)/L.g.length)+`<div class="tg qh">`+(A?`<div class="em">${pic(i)}</div><p class="mu">${w[2]}</p><b style="font-size:18px">Ruscha qaysi?</b>`:`<b style="font-size:clamp(26px,8vw,38px)">${w[0]}</b><p class="mu">${w[2]}</p><button class="btn o" style="padding:6px 14px" onclick="say(W[${i}][0])">🔊 Eshit</button><p><b>Qaysi rasm?</b></p>`)+`</div><div class="opts" style="${A?"":"grid-template-columns:1fr 1fr"}">${o.map(k=>`<button class="btn o ${A?"":"em2"}" data-k="${k}" onclick="qa(${k},this)">${A?`${W[k][0]}<small style="display:block;font-weight:500;opacity:.8">[${W[k][1]}]</small>`:P[k]}</button>`).join("")}</div>`;
if(!A)say(w[0]);scrollTo(0,0)}
function qa(k,b){if(L.lock)return;L.lock=true;
if(k===L.cur){L.ok++;L.qd++;st.xp+=2;save();L.q.shift();b.classList.add("good");beep(720);setTimeout(()=>beep(920,.08),70);say(W[k][0]);setTimeout(qz,1100)}
else{L.miss++;L.q.push(L.q.shift());b.classList.add("bad");const g=document.querySelector(`[data-k="${L.cur}"]`);if(g)g.classList.add("good");beep(160,.25);setTimeout(qz,1700)}}
function lvEnd(){const s3=L.miss==0?3:L.miss<=3?2:1;st.lv[L.k]=Math.max(st.lv[L.k]||0,s3);save();
$("mn").innerHTML=tb("🏁 Natija")+`<section class="hero" style="text-align:center"><div style="font-size:48px">${"⭐".repeat(s3)}</div><h1 style="font-size:28px">${LV[L.k][0]}</h1><p>${L.ok} ta to'g'ri · ${L.miss} ta xato · jami ${st.xp} XP</p></section>`+(L.k==2?`<div class="tg" style="text-align:left"><b style="font-size:16px">Eslab qol</b><p>Мой / Моя / Моё narsaning jinsiga qarab tanlanadi: -й erkak, -я ayol, -ё neytral.</p></div>`:"")+`<div class="opts">${L.k<2?`<button class="btn g" onclick="lvStart(${L.k+1})">Keyingi bosqich →</button>`:""}<button class="btn ${L.k<2?"o":"g"}" onclick="lvStart(${L.k})">Qayta o'tish</button><button class="btn o" onclick="play('m')">☄️ O'yinda sinab ko'r</button><button class="btn o" onclick="home()">Menyu</button></div>`;if(s3>1)conf();scrollTo(0,0)}
function home(){cancelAnimationFrame(raf);G=null;$("stage").hidden=true;$("mn").hidden=false;
$("mn").innerHTML=`<div class="top"><span class="chip">⭐ ${st.xp} XP</span><span class="chip">🔥 ${st.days} kun</span></div><section class="hero"><h1>Привет!</h1><p>Ruscha so'zlarni rasmlar va o'yinlar bilan o'rgan.</p><div class="hr">${[0,5,3,4].map(i=>pic(i)).join("")}</div></section><div class="modes"><button class="mode" onclick="learn()"><span class="ic" style="background:var(--bl);font-size:34px"><span class="an-bounce" style="display:inline-block">📖</span></span><span><b>O'rganish</b>Kartani ko'r, ovozini eshit, darhol sinab ko'r<br><span class="mu">3 bosqich · har bosqichda yulduzlar</span></span></button>${Object.entries(games).map(([k,d])=>`<button class="mode" onclick="play('${k}')"><span class="ic" style="background:var(${d.col})">${d.ic}</span><span><b>${d.name}</b>${d.tag}<br><span class="mu">Rekord: ${st.best[k]||0}</span></span></button>`).join("")}</div><p style="margin-top:16px"><button class="btn o" style="padding:4px 12px;font-size:14px" onclick="thm()">Yorug' / qorong'i</button></p>`}
home();
</script>
</body>
</html>
